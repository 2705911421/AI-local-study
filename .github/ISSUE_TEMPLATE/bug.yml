name: Bug 报告
description: 报告可复现的产品问题
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: 请勿提交 API Key、Token、教材原文、备份文件或其他敏感数据。安全漏洞请使用私密安全报告。
  - type: input
    id: version
    attributes:
      label: 版本
      description: Release 版本、提交 SHA 或部署地址
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 运行形态
      options:
        - Windows 桌面版
        - Web 版
        - GHCR 容器
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. …\n2. …\n3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: Windows/浏览器版本、Node.js 版本、模型来源等；请先移除敏感信息。
